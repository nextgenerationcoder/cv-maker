<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV Maker - Job Search</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Job Search</h1>

    <form id="url-form">
      <input
        type="url"
        id="linkedin-url"
        placeholder="Paste a LinkedIn job search URL to fill the form below"
      />
      <button type="submit">Fill from URL</button>
    </form>
    <p id="url-status"></p>

    <form id="search-form">
      <input type="text" id="search-term" placeholder="Job title or keywords" required />
      <input type="text" id="location" placeholder="Location (optional)" />
      <select id="site-name">
        <option value="indeed" selected>Indeed</option>
        <option value="linkedin">LinkedIn</option>
        <option value="zip_recruiter">ZipRecruiter</option>
        <option value="glassdoor">Glassdoor</option>
        <option value="google">Google</option>
      </select>

      <input
        type="number"
        id="hours-old"
        placeholder="Posted within (hours)"
        min="1"
        list="hours-old-presets"
      />
      <datalist id="hours-old-presets">
        <option value="5"></option>
        <option value="24"></option>
        <option value="72"></option>
        <option value="168"></option>
        <option value="720"></option>
      </datalist>

      <select id="job-type">
        <option value="" selected>Any job type</option>
        <option value="fulltime">Full-time</option>
        <option value="parttime">Part-time</option>
        <option value="contract">Contract</option>
        <option value="temporary">Temporary</option>
        <option value="internship">Internship</option>
        <option value="volunteer">Volunteer</option>
      </select>

      <input type="number" id="distance" placeholder="Distance (miles)" min="0" />

      <label><input type="checkbox" id="is-remote" /> Remote only</label>
      <label><input type="checkbox" id="easy-apply" /> Easy apply only</label>

      <button type="submit">Search</button>
    </form>
    <p id="status"></p>
    <ul id="results"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
