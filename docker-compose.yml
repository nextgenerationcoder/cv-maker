services:
  backend:
    build: ./backend
    restart: always
    environment:
      - CV_DB_PATH=/data/cv.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env — see .env.example}
    volumes:
      - cv_data:/data
    networks:
      - n8n-compose_default
    # Internal only — reached by the frontend container over the shared
    # network. No Traefik labels: nothing should route to this directly.

  frontend:
    build: ./frontend
    restart: always
    networks:
      - n8n-compose_default
    labels:
      - traefik.enable=true
      - traefik.http.routers.cvmaker.rule=Host(`cvmaker.amirseyti.de`)
      - traefik.http.routers.cvmaker.tls=true
      - traefik.http.routers.cvmaker.entrypoints=web,websecure
      - traefik.http.routers.cvmaker.tls.certresolver=mytlschallenge
      - traefik.http.services.cvmaker.loadbalancer.server.port=80

networks:
  n8n-compose_default:
    external: true

volumes:
  cv_data:
